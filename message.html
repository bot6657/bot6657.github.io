<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="gb2312">
<title>留言板</title>
<style>
body {
    font-size:9pt;
    line-height:14pt;
    background-image: url("beijing.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
}
a:link {
    font-size:9pt;
    text-decoration:none;
}
a:visited {
    font-size:9pt;
    text-decoration:none;
}
a:hover {
    color:red;
    text-decoration:none;
}
table {
    background-color:rgba(255,255,255,0.85);
}
.navtd {
    border:1px ridge #a7d6ba;
    width:103px;
    text-align:center;
    background:#a7d6ba;
}
input[type="text"], textarea {
    border:1px solid #70b8e2;
    padding:4px;
    font-size:9pt;
}
input[type="submit"], input[type="reset"] {
    background-color:#a7d6ba;
    border:1px solid #7fb894;
    padding:5px 20px;
    cursor:pointer;
}
input[type="submit"]:hover, input[type="reset"]:hover {
    background-color:#7fb894;
    color:#ffffff;
}
</style>
</head>
<body>
<div align="center">

<h1>留言板</h1>
<hr>

<p><a href="index.html">>> 返回个人主页</a></p>

<!-- 留言表单 -->
<table width="720" border="1" cellpadding="10" cellspacing="2" bordercolor="#70b8e2">
<form method="post" action="#">
    <tr>
        <td width="20%">留言人：</td>
        <td><input type="text" name="username" size="30"></td>
    </tr>
    <tr>
        <td>邮箱：</td>
        <td><input type="text" name="mail" size="30"></td>
    </tr>
    <tr>
        <td>留言内容：</td>
        <td><textarea rows="6" cols="40" name="msg"></textarea></td>
    </tr>
    <tr>
        <td></td>
        <td>
            <input type="submit" value="提交留言">
            &nbsp;&nbsp;
            <input type="reset" value="重置">
        </td>
    </tr>
</form>
</table>

<h3>—— 留言展示区（预留） ——</h3>
<p>此处用于展示所有访客提交的留言内容。</p>
<p style="color:#999;">【说明】留言保存与展示的后端动态功能预留</p>

</div>
</body>
</html>
